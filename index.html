<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paperplay — 拼出你的声音</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="#" aria-label="Paperplay 首页"><span class="brand-mark">p<span>p</span></span>paperplay<span class="brand-dot">®</span></a><div class="project"><input id="projectName" aria-label="项目名称" value="我的第一张实验海报"><span id="saveStatus">已在本机保存</span></div><div class="top-actions"><button id="undo" class="icon" title="撤销 Ctrl+Z" aria-label="撤销">↶</button><button id="redo" class="icon" title="重做 Ctrl+Shift+Z" aria-label="重做">↷</button><span class="separator"></span><button id="saveProject">保存项目</button><button id="export" class="primary">导出图片 <span>↗</span></button></div></header>
<div class="workspace">
<aside class="library"><div class="library-head"><h2>创作工具</h2><span>随手拼，大胆玩。</span></div><nav class="tabs" aria-label="素材分类"><button class="active" data-tab="templates">风格</button><button data-tab="photos">照片</button><button data-tab="stickers">贴纸</button><button data-tab="text">文字</button></nav><div id="libraryContent"></div><section class="layers-section"><div class="section-title"><h2>图层</h2><span id="layerCount"></span></div><div id="layers"></div><p class="small-hint">点击选择 · 锁定后不参与随机</p></section><div class="library-footer"><span class="tiny-mark">※</span><span>不必完美。只要是你。</span><button id="openProject" title="打开已保存项目">打开项目 ↗</button></div></aside>
<main class="stage"><div class="stage-toolbar"><div><span class="live-dot"></span><h1>拼贴工作台</h1><span class="stage-subtitle">/ Cut & paste</span></div><select id="ratio" aria-label="画布比例"><option value="portrait">竖版海报 · 2:3</option><option value="square">方形封面 · 1:1</option><option value="phone">手机壁纸 · 9:16</option></select></div><div class="canvas-zone" id="canvasZone"><div class="canvas-wrapper"><div class="canvas-meta"><span id="dimensionLabel">1200 × 1800 px</span><span>你的下一张代表作。</span></div><canvas id="poster" width="800" height="1200" tabindex="0" aria-label="海报编辑画布，拖动选中元素，方向键微调位置"></canvas></div></div><div class="canvas-tools"><span id="selectionLabel">正在编辑：人物剪贴</span><div><button id="zoomOut" aria-label="缩小画布">−</button><button id="zoomReset">适应画布</button><button id="zoomIn" aria-label="放大画布">＋</button><span class="separator"></span><button id="preview">纯净预览 ↗</button></div></div><div class="variant-bar"><div><span class="spark">※</span><div><strong>让意外发生。</strong><p>保留喜欢的，试试其他可能。</p></div></div><div class="variant-actions"><select id="randomLevel" aria-label="变体强度"><option value="small">微调</option><option value="medium" selected>重组</option><option value="bold">大胆</option></select><button id="generate" class="dark">生成 4 个变体 <span>↗</span></button></div></div><div id="variants" class="variants" hidden></div></main>
<aside class="inspector"><div class="inspector-title"><h2>调整你的作品</h2><span class="small-hint">每个细节，都由你。</span></div><section><div class="section-title"><h3>色彩方案</h3><span id="paletteName">酸性粉</span></div><div id="palettes" class="palettes"></div></section><section><div class="section-title"><h3>印刷实验室</h3><button id="resetEffects" class="text-button">重置</button></div><label class="range-label">半调网点 <output id="dotsValue"></output><input id="dots" type="range" min="0" max="100"></label><label class="range-label">复印颗粒 <output id="grainValue"></output><input id="grain" type="range" min="0" max="100"></label><label class="range-label">色彩浓度 <output id="inkValue"></output><input id="ink" type="range" min="0" max="100"></label><label class="switch-row"><span>纸张折痕</span><input id="creases" type="checkbox" role="switch"></label></section><section><div class="section-title"><h3 id="objectTitle">人物剪贴</h3><button id="toggleLock" class="text-button">锁定</button></div><div id="objectControls"></div><label class="range-label">大小 <output id="scaleValue"></output><input id="scale" type="range" min="30" max="180"></label><label class="range-label">旋转 <output id="rotationValue"></output><input id="rotation" type="range" min="-35" max="35"></label><div class="position-controls"><label>X<input id="positionX" type="number" min="-100" max="900"></label><label>Y<input id="positionY" type="number" min="-100" max="1600"></label></div><div class="object-actions"><button id="moveForward">上移一层 ↑</button><button id="deleteLayer">删除图层</button></div></section><section class="studio-note"><span>小小创作提示</span><p>让一点“不对劲”留在画面里。<br>有时候，错位才是对的。</p><span class="note-line">Make a little mess.</span></section><div class="inspector-footer">本地创作 · 照片无需上传服务器</div></aside>
</div><input id="photoInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="projectInput" type="file" accept=".json" hidden><div id="toast" role="status" aria-live="polite"></div><dialog id="exportDialog"><form method="dialog"><div class="dialog-head"><h2>把作品带走。</h2><button aria-label="关闭">×</button></div><p>导出不包含编辑选框，保留全部纹理效果。</p><label>文件格式<select id="exportFormat"><option value="png">PNG · 无损画质</option><option value="jpeg">JPG · 更小体积</option></select></label><label>图片尺寸<select id="exportSize"><option value="1.5">高清 · 1200 px 宽</option><option value="3">超清 · 2400 px 宽</option></select></label><button id="download" class="primary" type="button">下载图片 ↗</button></form></dialog><script src="assets.js"></script><script src="app.js"></script></body></html>
